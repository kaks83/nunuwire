name: Daily RSS Update

on:
  schedule:
    - cron: '0 6 * * *'  # Runs at 6:00 AM UTC every day
  workflow_dispatch:      # Allows you to manually trigger it for testing

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Required to push the updated index.html back to the repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run generator script
        run: node generate.js
        
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add index.html
          git commit -m "Automated daily news update" || exit 0
          git push
